[project]
name = "rss-alert"
version = "2.4.12"
description = "Sends an alert for new entries in an rss feed"
requires-python = ">=3.15"
dependencies = [
    "feedparser==6.0.14",
    "filelock==4.2.0",
    "httpx2==2.13.1",
    "loguru==0.7.3",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "python-dotenv==1.2.4",
    "python-telegram-bot==22.8",
    "tenacity==9.2.1",
    "truststore==0.10.5",
    "typer==0.27.3",
]

[dependency-groups]
dev = [
    "ruff==0.17.0",
    "ty==0.0.88",
]

[tool.uv]
package = true

[project.scripts]
rss-alert = "rss_alert.main:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F", "S", "I"]
