[project]
name = "rss-alert"
version = "2.4.1"
description = "Sends an alert for new entries in an rss feed"
requires-python = ">=3.14"
dependencies = [
    "feedparser>=6.0.12",
    "filelock>=3.29.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "python-telegram-bot>=22.7",
    "tenacity>=9.1.4",
    "truststore>=0.10.4",
    "typer>=0.25.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.13",
    "ty>=0.0.38",
]

[tool.uv]
package = true

[project.scripts]
rss-alert = "rss_alert.main:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F", "S", "I"]
